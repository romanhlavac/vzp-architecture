name: Miro – sjednocení rohů doménových kontejnerů

on:
  # Po začlenění workflow do main se bezpečně spustí právě pilotní změna.
  # Další změny vyžadují explicitní ruční režim (bez následné samovolné opravy).
  push:
    branches: [main]
    paths:
      - '.github/workflows/miro-sjednoceni-rohu.yml'
  workflow_dispatch:
    inputs:
      rezim:
        description: "Postup: kontrola bez zápisu, jeden pilotní tvar nebo dokončení po pilotu"
        required: true
        default: kontrola
        type: choice
        options:
          - kontrola
          - pilot
          - oprava
      vizualni_revize_schvalena:
        description: "Potvrzuji, že vzhled pilotního tvaru byl vizuálně ověřen v Miro (nutné pro režim oprava)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: miro-uprava-rohu
  cancel-in-progress: false

jobs:
  kontrola:
    # Tajné hodnoty používat jen pro workflow spuštěné z hlavní větve.
    if: github.ref == 'refs/heads/main'
    name: Ověřit a případně upravit stávající tvary
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 10
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      REZIM: ${{ github.event_name == 'push' && 'pilot' || inputs.rezim }}
      VIZUALNI_REVIZE_SCHVALENA: ${{ inputs.vizualni_revize_schvalena && 'ano' || 'ne' }}
    steps:
      - name: Načíst bezpečně pouze zdrojový kód
        uses: actions/checkout@v4
      - name: Provést vybranou kontrolu nebo opravu
        run: python3 automatizace/miro/sjednotit_rohy.py
