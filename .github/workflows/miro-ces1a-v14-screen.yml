name: VZP ES v14 · approved candidate semantic screening
on:
  push:
    branches: [main]
    paths: ["automatizace/miro/ces1a_v14_screen.py", ".github/workflows/miro-ces1a-v14-screen.yml"]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: miro-ces1a-v14-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.repository == 'romanhlavac/vzp-architecture'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 18
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile automatizace/miro/ces1a_v14_screen.py
      - run: python3 automatizace/miro/ces1a_v14_screen.py
