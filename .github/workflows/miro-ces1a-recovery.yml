name: VZP 1A · Recovery read-only inventory
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miro-ces1a-recovery.yml"
      - "automatizace/miro/ces1a_recovery_audit.py"
permissions:
  contents: read
jobs:
  inventory:
    if: github.repository == 'romanhlavac/vzp-architecture'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 8
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      CES_BRANCH_MODE: audit
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 automatizace/miro/ces1a_recovery_audit.py
