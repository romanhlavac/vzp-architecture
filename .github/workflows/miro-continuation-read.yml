name: Miro continuation read-only evidence
on:
  push:
    branches: [main]
    paths: ['automatizace/miro/continuation_read.py', '.github/workflows/miro-continuation-read.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: miro-continuation-read
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 20
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 automatizace/miro/continuation_read.py
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-continuation
          path: encrypted-evidence/continuation.p7m
          retention-days: 1
