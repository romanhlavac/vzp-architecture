name: VZP L1 v3 · refine event descriptions
on:
  push:
    branches: [main]
    paths:
      - "automatizace/miro/l1_v3_refine_descriptions.py"
      - ".github/workflows/miro-l1-v3-refine-descriptions.yml"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: audit
        options: [audit, pilot, apply]
permissions: {contents: read}
concurrency:
  group: miro-l1-v3-description-refinement
  cancel-in-progress: false
jobs:
  refine:
    if: github.repository == 'romanhlavac/vzp-architecture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 35
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      L1V3_DESC_MODE: ${{ github.event_name == 'push' && 'pilot' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile automatizace/miro/l1_v3_refine_descriptions.py
      - run: python3 automatizace/miro/l1_v3_refine_descriptions.py
