name: VZP ES v14 · Facing-edge connector routing repair
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miro-ces1a-v14-routing.yml"
      - "automatizace/miro/ces1a_v14_routing_repair.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only audit, one-connector pilot, or complete audited routing correction"
        type: choice
        required: true
        default: audit
        options: [audit, pilot, apply]
permissions:
  contents: read
concurrency:
  group: miro-v14-routing-native
  cancel-in-progress: false
jobs:
  route:
    if: github.repository == 'romanhlavac/vzp-architecture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 22
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      V14_ROUTING_MODE: ${{ github.event_name == 'push' && 'apply' || inputs.mode }}
      V14_MODE: audit
      V14_REGROUP_MODE: audit
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile
        run: python3 -m py_compile automatizace/miro/ces1a_v14_routing_repair.py
      - name: Diagnose or correct native V14 connector anchors
        run: python3 automatizace/miro/ces1a_v14_routing_repair.py
