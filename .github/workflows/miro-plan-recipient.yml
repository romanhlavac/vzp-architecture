name: Miro encrypted plan recipient
on:
  push:
    branches: [main]
    paths: ['automatizace/miro/plan_recipient.py']
permissions: {contents: read}
jobs:
  recipient:
    runs-on: ubuntu-latest
    environment: miro-external-probe
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 automatizace/miro/plan_recipient.py
      - uses: actions/upload-artifact@v4
        with: {name: encrypted-plan-recipient, path: private-evidence/recipient.json, retention-days: 1}
