name: CES DEMO · remove superseded DL event Doc
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miro-ces-demo-remove-old-catalog.yml"
      - "automatizace/miro/ces_demo_remove_old_catalog.py"
permissions:
  contents: read
concurrency:
  group: vzp-ces-demo-old-catalog
  cancel-in-progress: false
jobs:
  remove:
    if: github.repository == 'romanhlavac/vzp-architecture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 10
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      DEMO_OLD_DOC_MODE: audit
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile automatizace/miro/ces_demo_remove_old_catalog.py
      - run: python3 automatizace/miro/ces_demo_remove_old_catalog.py
