name: Miro isolated workspace read-only audit

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Read-only inventory audit
        required: true
        default: audit
        type: choice
        options: [audit]

permissions:
  contents: read

concurrency:
  group: miro-isolated-workspace
  cancel-in-progress: false

jobs:
  isolated:
    if: github.repository == 'romanhlavac/vzp-architecture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 20
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read-only audit or fail-closed preparation
        env:
          COPY_PHASE: audit
        run: python3 automatizace/miro/isolated_board_copy.py
