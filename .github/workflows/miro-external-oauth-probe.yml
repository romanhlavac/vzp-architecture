name: Miro external OAuth metadata probe

# Safe for a public repository: never print Miro identifiers, token, or API responses.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: miro-external-oauth-probe
  cancel-in-progress: false

jobs:
  check:
    name: Check OAuth and board metadata access (no write)
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 5
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
    steps:
      - name: OAuth and board access probe (suppress identifiers and responses)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ.get('MIRO_DIAGNOSTIC_TOKEN', '').strip()
          board_id = os.environ.get('MIRO_DIAGNOSTIC_BOARD_ID', '').strip()
          if not token or not board_id:
              print('FAIL: required environment secrets are missing.')
              sys.exit(2)

          def read_json(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Authorization': 'Bearer ' + token,
                      'Accept': 'application/json',
                  },
                  method='GET',
              )
              # Do not print request URLs, response bodies, headers or exceptions.
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status != 200:
                      raise ValueError('non-200 API response')
                  return json.loads(response.read())

          def extract_id(obj):
              if isinstance(obj, dict):
                  return str(obj.get('id', '')).strip()
              return str(obj or '').strip()

          try:
              context = read_json('https://api.miro.com/v1/oauth-token')
          except Exception:
              print('FAIL: OAuth token context unavailable or token invalid.')
              sys.exit(3)

          scope_value = context.get('scopes', context.get('scope', []))
          if isinstance(scope_value, str):
              scopes = set(scope_value.replace(',', ' ').split())
          elif isinstance(scope_value, list):
              scopes = {str(v) for v in scope_value}
          else:
              scopes = set()
          if not {'boards:read', 'boards:write'}.issubset(scopes):
              print('FAIL: token does not confirm both boards:read and boards:write.')
              sys.exit(4)

          try:
              safe_board_id = urllib.parse.quote(board_id, safe='')
              board = read_json('https://api.miro.com/v2/boards/' + safe_board_id)
          except Exception:
              print('FAIL: cannot read board metadata with this OAuth token.')
              sys.exit(5)

          context_team = extract_id(context.get('team') or context.get('team_id'))
          board_team = extract_id(board.get('team') or board.get('team_id'))
          if not context_team or not board_team:
              print('FAIL: team identity not available for strict comparison.')
              sys.exit(6)
          if context_team != board_team:
              print('FAIL: OAuth team does not match board team.')
              sys.exit(7)

          # Intentionally do NOT print or upload any team/board/user metadata.
          print('PASS: OAuth scopes confirmed; board metadata readable; team matches; no Miro write performed.')
          PY
