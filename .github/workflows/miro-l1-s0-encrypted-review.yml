name: VZP L1 v3 · S0 encrypted business evidence
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miro-l1-s0-encrypted-review.yml"
      - "automatizace/miro/l1_s0_encrypted_review.py"
  workflow_dispatch:
permissions: {contents: read}
jobs:
  collect:
    if: github.repository == 'romanhlavac/vzp-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: miro-external-probe
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      L1V3_MODE: audit
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Compile
        run: python3 -m py_compile automatizace/miro/l1_s0_encrypted_review.py
      - name: Fetch and encrypt S0 live records
        run: python3 automatizace/miro/l1_s0_encrypted_review.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: encrypted-s0-business-review
          path: s0-evidence/s0.p7m
          retention-days: 1
