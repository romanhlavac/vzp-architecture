name: Cross-agent state validation
on:
  push:
    paths: ['cross-agent/**', 'tests/**', '.claude/settings.json', '.github/workflows/cross-agent-state-validate.yml']
  pull_request:
    paths: ['cross-agent/**', 'tests/**', '.claude/settings.json', '.github/workflows/cross-agent-state-validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check schema and each state transition
        env:
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python cross-agent/check_ci.py
      - name: Ownership, stale baseline, recovery and privacy tests
        run: python -m unittest discover -s tests -v
