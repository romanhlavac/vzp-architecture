name: CES DEMO 1A-1B layout refine
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miro-ces-demo-layout-refine.yml"
      - "automatizace/miro/ces_demo_layout_1a_1b_refine_20261023.py"
permissions: {contents: read}
concurrency:
  group: miro-ces-demo-layout-refine
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'romanhlavac/vzp-architecture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 25
    env:
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      LAYOUT_MODE: audit
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile automatizace/miro/ces_demo_layout_1a_1b_refine_20261023.py
      - run: python3 automatizace/miro/ces_demo_layout_1a_1b_refine_20261023.py
