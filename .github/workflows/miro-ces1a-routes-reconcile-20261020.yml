name: VZP CES1A event-to-event routing acceptance
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miro-ces1a-routes-reconcile-20261020.yml"
      - "automatizace/miro/ces1a_routes_reconcile_20261020.py"
  workflow_dispatch:
    inputs:
      mode:
        required: true
        type: choice
        default: audit
        options: [audit, apply]
permissions: {contents: read}
concurrency:
  group: miro-ces1a-route-reconcile
  cancel-in-progress: false
jobs:
  route:
    if: github.repository == 'romanhlavac/vzp-architecture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 35
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      MIRO_ROUTE_MODE: ${{ github.event_name == 'push' && 'apply' || inputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - run: python3 -m py_compile automatizace/miro/ces1a_routes_reconcile_20261020.py
      - run: python3 automatizace/miro/ces1a_routes_reconcile_20261020.py
