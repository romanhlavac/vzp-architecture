name: Isolated workspace safety tests
on:
  push:
    paths:
      - 'cross-agent/risk_policy.py'
      - 'automatizace/miro/isolated*'
      - 'tests/test_isolated_workspace.py'
      - '.github/workflows/miro-isolated-copy.yml'
      - '.github/workflows/isolated-workspace-tests.yml'
  pull_request:
    paths:
      - 'cross-agent/risk_policy.py'
      - 'automatizace/miro/isolated*'
      - 'tests/test_isolated_workspace.py'
      - '.github/workflows/miro-isolated-copy.yml'
      - '.github/workflows/isolated-workspace-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_isolated_workspace.py -v
