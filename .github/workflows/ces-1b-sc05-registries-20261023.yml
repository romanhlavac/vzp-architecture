name: CES 1B SC05 external registries native REST (one-time)
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ces-1b-sc05-registries-20261023.yml"
permissions: {contents: read}
concurrency:
  group: miro-ces-1b-sc05-registries
  cancel-in-progress: false
jobs:
  build-and-audit:
    if: github.repository == 'romanhlavac/vzp-architecture' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: miro-external-probe
    timeout-minutes: 30
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Preflight compile
        run: python3 -m py_compile automatizace/miro/ces1b_sc05_external_registry_demo_20261023.py
      - name: REST native create and independent readback
        run: python3 automatizace/miro/ces1b_sc05_external_registry_demo_20261023.py
