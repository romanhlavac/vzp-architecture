name: Cross-agent lifecycle regression

on:
  push:
    paths:
      - "cross-agent/prompt_state.py"
      - "cross-agent/state.json"
      - "cross-agent/tests/test_orphan_finalization.py"
      - ".github/workflows/cross-agent-lifecycle-regression.yml"
  pull_request:
    paths:
      - "cross-agent/prompt_state.py"
      - "cross-agent/tests/test_orphan_finalization.py"
      - ".github/workflows/cross-agent-lifecycle-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: python -m py_compile cross-agent/prompt_state.py cross-agent/tests/test_orphan_finalization.py
      - name: Lifecycle regressions
        run: python -m unittest discover -s cross-agent/tests -p test_orphan_finalization.py -v
