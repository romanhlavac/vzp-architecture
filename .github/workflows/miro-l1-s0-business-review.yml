name: VZP L1 v3 · S0 1B source coverage review
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/miro-l1-s0-business-review.yml"
      - "automatizace/miro/l1_s0_business_review_audit.py"
permissions: {contents: read}
jobs:
  verify:
    if: github.repository == 'romanhlavac/vzp-architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: miro-external-probe
    env:
      MIRO_DIAGNOSTIC_TOKEN: ${{ secrets.MIRO_DIAGNOSTIC_TOKEN }}
      MIRO_DIAGNOSTIC_BOARD_ID: ${{ secrets.MIRO_DIAGNOSTIC_BOARD_ID }}
      L1V3_MODE: audit
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate
        run: python3 -m py_compile automatizace/miro/l1_s0_business_review_audit.py
      - name: S0 fresh live read-back
        run: python3 automatizace/miro/l1_s0_business_review_audit.py
